name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # publishes the "latest" GitHub Release with the APKs (used by the website download links)

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: repo Settings → Secrets → Actions → TOMTOM_API_KEY. Empty = free OpenFreeMap map.
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # GitHub's Ubuntu runners ship the Android SDK with licenses accepted;
      # AGP downloads the missing platform (API 37) and build-tools on first use.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APKs (minified, one per CPU type)
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: buslive-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APKs
        uses: actions/upload-artifact@v7
        with:
          name: buslive-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APKs as the latest release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "BusLive – latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). Most phones: app-arm64-v8a-release.apk. Any phone: app-universal-release.apk." \
            --target "$GITHUB_SHA" --latest
