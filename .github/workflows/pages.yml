name: Website (GitHub Pages)

# Builds the BusLive web app (web/) with fresh stops + lines from the Stride API and publishes it to
# https://markovo1234.github.io/buslive/ . One-time setup: repo Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main, claude/buslive-android-app-0tttpv]
    paths: ["web/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "17 1 * * *"   # daily, ~03:17 Israel time: refresh stops and lines
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download today's stops and lines
        run: python web/tools/build_data.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
